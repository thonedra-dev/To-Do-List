<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Manager</title>
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle" onclick="toggleTheme()">
        <span>Theme</span>
    </div>

    <div class="container">
        <h1 class="title">✨ Login</h1>
        <form action="/login" method="POST" class="login-form">
            <div>
                <label for="username" class="label">👤 Username</label>
                <input type="text" name="username" id="username" class="input-field" placeholder="Enter your username" required>
            </div>

            <div>
                <label for="password" class="label">🔒 Password</label>
                <input type="password" name="password" id="password" class="input-field" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">🚀 Login</button>
        </form>

        <p>Don't have an account? <a href="/register" class="link">Register here</a></p>
    </div>

    <script>
        // Theme toggle functionality
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            
            // Save theme preference to localStorage
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }

        // Load saved theme on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        });
    </script>
</body>
</html>
