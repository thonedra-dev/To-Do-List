<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="TaskFlow — Task, Meeting and Project Management, reimagined as one platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0820"/>
      <stop offset="55%" stop-color="#1b1245"/>
      <stop offset="100%" stop-color="#0a2a4a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="titleClip"><text x="600" y="215" text-anchor="middle" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-3">TaskFlow</text></clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.045">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/>
  </g>

  <!-- floating orbs -->
  <g filter="url(#blur)">
    <circle cx="140" cy="120" r="78" fill="url(#orbA)">
      <animate attributeName="cy" values="120;160;120" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="140;170;140" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="90" r="92" fill="url(#orbB)">
      <animate attributeName="cy" values="90;140;90" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1040;1000;1040" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="340" r="56" fill="url(#orbC)">
      <animate attributeName="cy" values="340;300;340" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="345" r="48" fill="url(#orbB)">
      <animate attributeName="cy" values="345;310;345" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="320" cy="70" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="60" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="360" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="260" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="230" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="385" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glass panel -->
  <rect x="150" y="70" width="900" height="280" rx="34" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
  <rect x="150" y="70" width="900" height="140" rx="34" fill="#ffffff" fill-opacity="0.035"/>

  <!-- check-mark emblem -->
  <g transform="translate(600 118)" filter="url(#glow)">
    <circle r="26" fill="none" stroke="url(#title)" stroke-width="4"/>
    <path d="M-11 1 L-3 10 L12 -8" fill="none" stroke="url(#title)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 60;60 0" dur="1.6s" fill="freeze"/>
    </path>
  </g>

  <!-- title -->
  <text x="600" y="215" text-anchor="middle" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-3" fill="url(#title)" filter="url(#glow)">TaskFlow</text>
  <g clip-path="url(#titleClip)">
    <rect x="-300" y="110" width="260" height="130" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1500" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="268" text-anchor="middle" font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="27" fill="#e0e7ff" fill-opacity="0.92" letter-spacing="1">Tasks · Meetings · Projects — one platform.</text>

  <!-- feature chips -->
  <g font-family="'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <g transform="translate(345 300)">
      <rect width="150" height="34" rx="17" fill="#38bdf8" fill-opacity="0.16" stroke="#7dd3fc" stroke-opacity="0.6"/>
      <text x="75" y="22" fill="#bae6fd">React · Vite</text>
    </g>
    <g transform="translate(525 300)">
      <rect width="150" height="34" rx="17" fill="#c084fc" fill-opacity="0.16" stroke="#d8b4fe" stroke-opacity="0.6"/>
      <text x="75" y="22" fill="#e9d5ff">Flask API</text>
    </g>
    <g transform="translate(705 300)">
      <rect width="150" height="34" rx="17" fill="#fb923c" fill-opacity="0.16" stroke="#fdba74" stroke-opacity="0.6"/>
      <text x="75" y="22" fill="#fed7aa">MySQL</text>
    </g>
  </g>
</svg>
