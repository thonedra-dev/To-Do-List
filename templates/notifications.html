<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/notifications.css') }}">
</head>
<body>

    <script>
        (function () {
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        })();
    </script>

    <nav class="noti-nav">

        <div class="nav-left">
            <a href="/" class="nav-back" title="Back to Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <div class="nav-brand">
                <a href="/" class="brand-link">Task Manager</a>
                <span class="nav-sep">/</span>
                <span class="nav-current">Notifications</span>
            </div>
        </div>

        <div class="nav-icons">

            <button class="nav-icon-btn" onclick="toggleNotiTheme()" title="Toggle Theme">
                <svg class="icon-dark" xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-light" xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1"  x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>

            <button class="nav-icon-btn nav-icon-active" title="Notifications — current page">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="noti-dot-nav" id="noti-dot-nav"></span>
            </button>

            <button class="nav-icon-btn nav-icon-static" title="Chatbox — coming soon">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>

            <button class="nav-icon-btn nav-icon-static" title="Support — coming soon">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>

            <button class="nav-icon-btn nav-icon-static" title="About Us — coming soon">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8"  x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </button>

        </div>
    </nav>

    <div class="noti-layout">

        <aside class="noti-sidebar">
            <div class="user-panel">
                <div class="user-avatar-wrap">
                    {% if profile_pic %}
                        <img src="{{ url_for('static', filename=profile_pic) }}"
                             alt="{{ username }}" class="user-avatar-img">
                    {% else %}
                        <div class="user-avatar-placeholder">{{ username[0]|upper }}</div>
                    {% endif %}
                </div>
                <div class="user-name">{{ username }}</div>
                {% if email %}
                    <div class="user-meta">{{ email }}</div>
                {% endif %}
                {% if position %}
                    <div class="user-position">{{ position }}</div>
                {% endif %}
            </div>
        </aside>

        <main class="noti-feed" id="noti-feed">

            <div id="skeleton-wrap">
                <div class="skel-card"><div class="skel-line w40"></div><div class="skel-line w70"></div><div class="skel-line w100"></div><div class="skel-line w60"></div></div>
                <div class="skel-card"><div class="skel-line w40"></div><div class="skel-line w70"></div><div class="skel-line w100"></div><div class="skel-line w60"></div></div>
                <div class="skel-card"><div class="skel-line w40"></div><div class="skel-line w70"></div><div class="skel-line w100"></div><div class="skel-line w60"></div></div>
            </div>

            <div id="noti-list"></div>

            <div class="empty-state" id="empty-state">
                <div class="empty-icon">📭</div>
                <p class="empty-title">No notifications yet</p>
                <p class="empty-sub">When someone invites you to a project, it will appear here.</p>
            </div>

        </main>
    </div>

    <div class="toast" id="toast"></div>

    <div id="image-modal" class="image-modal" onclick="closeImageModal()">
        <span class="close-modal" title="Close">&times;</span>
        <img class="modal-content" id="modal-img" onclick="event.stopPropagation()">
        <a id="modal-download" class="modal-download-btn" download="Project_Cover" onclick="event.stopPropagation()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download Image
        </a>
    </div>

    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
</body>
</html>
