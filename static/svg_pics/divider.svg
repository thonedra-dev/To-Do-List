<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="60" y1="20" x2="1140" y2="20" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <circle cx="600" cy="20" r="6" fill="#c084fc">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="20" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="20" r="3" fill="#f472b6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="20" r="4" fill="#fff">
      <animate attributeName="cx" values="60;1140" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
